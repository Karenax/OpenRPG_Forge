[workspace]
members = [
    "crates/forge_core",
    "crates/forge_gameplay",
    "crates/forge_navigation",
    "crates/forge_project",
    "crates/forge_world",
    "crates/forge_engine",
    "crates/forge_assets",
    "apps/forge_runtime",
    "apps/forge_studio",
    "tools/forge_cli",
]
exclude = ["tools/forge_navigation_benchmark", "third_party/rerecast-0.4.0", "third_party/rapier3d-0.35.0-glamx0.2", "third_party/bevy_image-0.19.1-ruzstd0.9.1"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui"] }
bevy_rapier3d = { version = "=0.36.0", default-features = false, features = ["dim3"] }
console_error_panic_hook = "=0.1.7"
forge_assets = { path = "crates/forge_assets" }
forge_core = { path = "crates/forge_core" }
forge_gameplay = { path = "crates/forge_gameplay" }
forge_navigation = { path = "crates/forge_navigation" }
forge_engine = { path = "crates/forge_engine", default-features = false }
forge_project = { path = "crates/forge_project" }
forge_world = { path = "crates/forge_world" }
leptos = { version = "=0.8.20", default-features = false, features = ["csr"] }
js-sys = "=0.3.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
serde-wasm-bindgen = "=0.6.5"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "=1.26.0", features = ["serde", "v5"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = "=0.3.104"

[patch.crates-io]
# ADR-0022: unchanged Bevy image code, official ruzstd security release.
bevy_image = { path = "third_party/bevy_image-0.19.1-ruzstd0.9.1" }
# Narrow KCC contact-normal fix retained from Source075; see third_party/rapier-normalization-NOTICE.md.
rapier3d = { path = "third_party/rapier3d-0.35.0-glamx0.2" }
# ADR-0009 owner-approved, raw-output-tested NAV019 fork. No wrapper/advisory edge.
rerecast = { path = "third_party/rerecast-0.4.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
