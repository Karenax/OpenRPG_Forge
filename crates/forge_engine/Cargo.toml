[package]
name = "forge_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bevy adapter for engine-neutral OpenRPG Forge scene documents."

[features]
default = ["native"]
native = ["physics-rapier"]
web = ["bevy/web", "bevy/webgpu", "physics-rapier"]
qualification = ["physics-rapier"]
# Purchased fixtures stay outside the repository and require an explicit local path.
private-source-fixtures = []
physics-rapier = ["dep:bevy_rapier3d", "dep:forge_assets", "dep:forge_navigation"]

[dependencies]
bevy.workspace = true
bevy_rapier3d = { workspace = true, optional = true }
forge_assets = { workspace = true, optional = true }
forge_core.workspace = true
forge_gameplay.workspace = true
forge_navigation = { workspace = true, optional = true }
forge_project.workspace = true
forge_world.workspace = true
# Bevy's public SortedPhaseItem API names this exact already-locked type.
indexmap = "=2.14.1"
serde.workspace = true
# Source clocks/camera values must round-trip exactly before GPU packet packing.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing.workspace = true
wgpu = { version = "=29.0.4", default-features = false, features = ["wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Window", "Performance"] }
getrandom = { version = "=0.3.4", default-features = false, features = ["wasm_js"] }

[dev-dependencies]
# Validate Forge optical WGSL with the same Naga version already locked by Bevy.
naga = { version = "=29.0.4", features = ["wgsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
forge_delivery = { path = "../../tools/forge_delivery" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
console_error_panic_hook.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true

[[example]]
name = "verify_source_particle_compute"
required-features = ["private-source-fixtures"]

[[example]]
name = "verify_source_particle_timeline"
required-features = ["private-source-fixtures"]

