[package]
name = "forge_assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Asset identity and provenance validation contracts for OpenRPG Forge."

[dependencies]
forge_core.workspace = true
serde.workspace = true
# Retain captured f64 phases/matrices before the renderer's explicit f32 conversion.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "ogg", "pcm", "vorbis", "wav"] }

[dev-dependencies]
forge_project.workspace = true

[lints]
workspace = true
