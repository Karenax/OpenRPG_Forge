[package]
name = "forge_navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Pure, validated navigation generation shared by Forge and its dedicated WebAssembly worker."
build = "build.rs"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
web = ["dep:wasm-bindgen", "getrandom/wasm_js"]

[dependencies]
glam = { version = "=0.32.1", default-features = false, features = ["std", "serde"] }
landmass = "=0.9.2"
rerecast = { version = "=0.4.0", default-features = false, features = ["std", "serialize", "libm"] }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", default-features = false }
wasm-bindgen = { workspace = true, optional = true }

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true
