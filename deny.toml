[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "Tauri 2.11.5 Linux transitively requires proc-macro-error 1.0.4 through GTK3; informational unmaintained notice with no safe upgrade in the pinned Tauri graph; track upstream replacement." },
    { id = "RUSTSEC-2024-0436", reason = "Leptos 0.8.20 transitively requires paste 1.0.15; informational unmaintained notice with no vulnerability reported; track the upstream replacement." },
    { id = "RUSTSEC-2025-0075", reason = "Tauri 2.11.5 transitively requires rust-unic 0.9 through urlpattern 0.3.0; informational unmaintained notice; track the upstream replacement." },
    { id = "RUSTSEC-2025-0080", reason = "Tauri 2.11.5 transitively requires rust-unic 0.9 through urlpattern 0.3.0; informational unmaintained notice; track the upstream replacement." },
    { id = "RUSTSEC-2025-0081", reason = "Tauri 2.11.5 transitively requires rust-unic 0.9 through urlpattern 0.3.0; informational unmaintained notice; track the upstream replacement." },
    { id = "RUSTSEC-2025-0098", reason = "Tauri 2.11.5 transitively requires rust-unic 0.9 through urlpattern 0.3.0; informational unmaintained notice; track the upstream replacement." },
    { id = "RUSTSEC-2025-0100", reason = "Tauri 2.11.5 transitively requires rust-unic 0.9 through urlpattern 0.3.0; informational unmaintained notice; track the upstream replacement." },
    { id = "RUSTSEC-2026-0173", reason = "Leptos 0.8.20 transitively requires proc-macro-error2 2.0.1; informational unmaintained notice with no vulnerability reported; track the upstream replacement." },
    { id = "RUSTSEC-2026-0192", reason = "Bevy 0.19.1 and winit 0.30.13 transitively require ttf-parser 0.25.1 for Linux decorations; informational unmaintained notice; track the upstream replacement." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
