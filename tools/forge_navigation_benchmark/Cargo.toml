[package]
name = "forge_navigation_benchmark"
default-run = "forge_navigation_benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated provider benchmark for the OpenRPG Forge navigation contract."

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
native-probe = []

[[bin]]
name = "canonical_terrain_probe"
path = "src/bin/canonical_terrain_probe.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_browser_guarded_probe"
path = "src/bin/canonical_browser_guarded_probe.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_uniform_sweep"
path = "src/bin/canonical_uniform_sweep.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_contour_diagnostic"
path = "src/bin/canonical_contour_diagnostic.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_navigation_campaign"
path = "src/bin/canonical_navigation_campaign.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_rapier_dynamic_probe"
path = "src/bin/canonical_rapier_dynamic_probe.rs"
required-features = ["native-probe"]

[[bin]]
name = "canonical_navigation_runtime_campaign"
path = "src/bin/canonical_navigation_runtime_campaign.rs"
required-features = ["native-probe"]

[dependencies]
bevy_landmass = { version = "=0.12.0", default-features = false }
bevy_math = { version = "=0.19.1", default-features = false }
bevy_rerecast = { version = "=0.5.0", default-features = false, features = ["libm"] }
forge_core = { path = "../../crates/forge_core" }
forge_project = { path = "../../crates/forge_project" }
forge_world = { path = "../../crates/forge_world" }
landmass = "=0.9.2"
landmass_rerecast = "=0.3.0"
rapier3d = { version = "=0.35.0-glamx0.2", default-features = false, features = ["dim3", "f32", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.127"

[patch.crates-io]
# Lab-only fix for rerecast 0.4.0's usize jitter hash overflow on wasm32.  The low 16-bit
# sequence is unchanged; production dependencies and the pinned campaign-002 bundle are intact.
rerecast = { path = "vendor/rerecast-0.4.0" }
# The lab disables bevy_asset; bevy_rerecast_core still declares its asset-loader-only bincode
# dependency unconditionally. Keep the same 0.5.0 source/API while removing that dead advisory edge.
bevy_rerecast_core = { path = "vendor/bevy_rerecast_core-0.5.0" }
# The lab uses the no-asset public rerecast stages. This thin wrapper fork removes its
# unconditional asset-loader feature so the dead bincode loader is not compiled or audited.
bevy_rerecast = { path = "vendor/bevy_rerecast-0.5.0" }
# Keep only the public raw conversion; the upstream Bevy asset bridge is unused by this lab and
# would force the asset loader edge back into the dependency graph.
landmass_rerecast = { path = "vendor/landmass_rerecast-0.3.0" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
