[package]
name = "forge_navigation_benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
description = "Isolated provider benchmark for the OpenRPG Forge navigation contract."

[dependencies]
bevy_landmass = { version = "=0.12.0", default-features = false }
bevy_math = { version = "=0.19.1", default-features = false }
bevy_rerecast = { version = "=0.5.0", default-features = false, features = ["libm"] }
forge_core = { path = "../../crates/forge_core" }
forge_world = { path = "../../crates/forge_world" }
landmass = "=0.9.2"
landmass_rerecast = "=0.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", default-features = false, features = ["wasm_js"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
