[workspace]
resolver = "3"

[package]
name = "forge_delivery"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
forge_assets = { path = "../../crates/forge_assets" }
forge_core = { path = "../../crates/forge_core" }
forge_gameplay = { path = "../../crates/forge_gameplay" }
forge_project = { path = "../../crates/forge_project" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
# Native evidence contract shares the domain's canonical terrain HLOD limit.
forge_world = { path = "../../crates/forge_world" }

[lints.rust]
unsafe_code = "deny"

[profile.release]
strip = "debuginfo"
