[workspace]
resolver = "3"

[package]
name = "forge-glib-variant-str-iter-regression"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

[features]
baseline = ["dep:glib_baseline"]
patched = ["dep:glib_patched"]

[dependencies]
glib_baseline = { package = "glib", version = "=0.18.5", optional = true }
glib_patched = { package = "glib", path = "../../../third_party/glib-0.18.5", optional = true }

[[bin]]
name = "glib-variant-str-iter-probe"
path = "probe.rs"

[lints.rust]
unsafe_code = "deny"
