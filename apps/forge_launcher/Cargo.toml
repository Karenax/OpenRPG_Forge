[workspace]
resolver = "3"

[package]
name = "forge_launcher_prototype"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
description = "Tauri 2 desktop shell for the Aube des royaumes launcher and Tidewater playtest."

[lib]
name = "forge_launcher_frontend"
crate-type = ["rlib"]

[[bin]]
name = "forge-launcher-prototype"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri"]
production = ["desktop", "tauri/custom-protocol"]

[dependencies]
forge_delivery = { path = "../../tools/forge_delivery" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "=2.11.5", optional = true, features = [] }

[build-dependencies]
tauri-build = "=2.6.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "debuginfo"
