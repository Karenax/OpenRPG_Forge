[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = false
locked = true

[serve]
addresses = ["127.0.0.1"]
port = 1420
open = false

[[hooks]]
stage = "post_build"
command = "pwsh"
command_arguments = ["-NoProfile", "-File", "../../scripts/Build-NavigationWorker.ps1", "-StageLocalAssets"]
