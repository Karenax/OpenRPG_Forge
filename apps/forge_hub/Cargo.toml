[workspace]
resolver = "3"

[package]
name = "forge_hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[dependencies]
forge_delivery = { path = "../../tools/forge_delivery" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = "=2.6.3"

[lints.rust]
unsafe_code = "deny"

[profile.release]
strip = "debuginfo"
