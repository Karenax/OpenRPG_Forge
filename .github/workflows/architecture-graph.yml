name: Architecture graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run architecture graph tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check generated architecture graph
        run: python scripts/architecture_graph.py check
