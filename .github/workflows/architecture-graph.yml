name: Architecture graph

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore architecture graph tests
        run: dotnet restore tests/Forge.ArchitectureGraph.Tests/Forge.ArchitectureGraph.Tests.csproj --locked-mode

      - name: Run architecture graph tests
        run: dotnet test tests/Forge.ArchitectureGraph.Tests/Forge.ArchitectureGraph.Tests.csproj --configuration Release --no-restore

      - name: Check generated architecture graph
        run: dotnet run --project tools/Forge.ArchitectureGraph --configuration Release --no-build -- check --full
