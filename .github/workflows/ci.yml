name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore OpenRPGForge.sln --locked-mode

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./scripts/Test-NuGetVulnerabilities.ps1

      - name: Build native ForgeScript bridge
        shell: pwsh
        run: ./scripts/Build-ForgeScriptNative.ps1

      - name: Verify formatting
        run: dotnet format OpenRPGForge.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build OpenRPGForge.sln --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test OpenRPGForge.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results/windows --collect:"XPlat Code Coverage"

      - name: Test Python tooling
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python -m unittest discover -s tools/asset_vault_browser/tests -p "test_*.py"

      - name: Validate schemas and generated documentation
        shell: pwsh
        run: |
          dotnet run --project tools/Forge.Cli --configuration Release --no-build -- docs check
          ./scripts/Update-AuroraParityTracker.ps1 -Check
          ./scripts/Test-AuroraEvidencePaths.ps1
          ./scripts/Update-CompleteFunctionBacklog.ps1 -Check
          ./scripts/Test-ProjectStatusConsistency.ps1
          ./scripts/Test-MaintainabilityBudgets.ps1
          dotnet run --project tools/Forge.ArchitectureGraph --configuration Release --no-build -- check --full

      - name: Validate reference fixtures
        run: dotnet test tests/Forge.ModuleFormat.Tests/Forge.ModuleFormat.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~BuildGovernanceEvidenceTests

      - name: Pack and validate reference module
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci | Out-Null
          dotnet run --project tools/Forge.Cli --configuration Release --no-build -- build apps/Forge.Runtime/content/crypt-of-ashes artifacts/ci/crypt-of-ashes.orpmod
          dotnet run --project tools/Forge.Cli --configuration Release --no-build -- package validate artifacts/ci/crypt-of-ashes.orpmod
          dotnet run --project tools/Forge.Cli --configuration Release --no-build -- package compliance apps/Forge.Runtime/content/crypt-of-ashes editor
          dotnet run --project tools/Forge.Cli --configuration Release --no-build -- governance run apps/Forge.Runtime/content/crypt-of-ashes

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-test-and-coverage
          path: |
            artifacts/test-results/windows
            artifacts/ci
          if-no-files-found: warn

  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Restore
        run: dotnet restore OpenRPGForge.sln --locked-mode

      - name: Test managed projects with coverage
        shell: pwsh
        run: |
          $projects = @(
            'tests/Forge.Domain.Tests/Forge.Domain.Tests.csproj',
            'tests/Forge.Application.Tests/Forge.Application.Tests.csproj',
            'tests/Forge.ModuleFormat.Tests/Forge.ModuleFormat.Tests.csproj',
            'tests/Forge.RpgKit.Domain.Tests/Forge.RpgKit.Domain.Tests.csproj',
            'tests/Forge.Scripting.Tests/Forge.Scripting.Tests.csproj',
            'tests/Forge.Network.Tests/Forge.Network.Tests.csproj',
            'tests/Forge.LiveDirector.Tests/Forge.LiveDirector.Tests.csproj',
            'tests/Forge.Mcp.Tests/Forge.Mcp.Tests.csproj',
            'tests/Forge.Studio.Core.Tests/Forge.Studio.Core.Tests.csproj',
            'tests/Forge.ArchitectureGraph.Tests/Forge.ArchitectureGraph.Tests.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project --configuration Release --no-restore --logger trx --results-directory artifacts/test-results/linux --collect:"XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { throw "Linux tests failed for $project." }
          }

      - name: Test Python tooling
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python -m unittest discover -s tools/asset_vault_browser/tests -p "test_*.py"

      - name: Check architecture graph
        run: dotnet run --project tools/Forge.ArchitectureGraph --configuration Release --no-restore -- check --full

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: linux-test-and-coverage
          path: artifacts/test-results/linux
          if-no-files-found: warn

  world-generation-addon-integration:
    needs: [windows-core, linux-core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: world-generation-addon-windows
          - os: ubuntu-latest
            platform: linux
            artifact: world-generation-addon-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Python
        if: matrix.platform == 'linux'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install Godot 4.7.1 .NET on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $engineRoot = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $engineRoot
          $engine = Get-ChildItem -LiteralPath $engineRoot -Recurse -Filter 'Godot_v4.7.1-stable_mono_win64_console.exe' -File | Select-Object -First 1
          if ($null -eq $engine) { throw 'Godot 4.7.1 .NET console executable was not found after extraction.' }
          $engine.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Godot 4.7.1 .NET and PCG build tools on Linux
        if: matrix.platform == 'linux'
        shell: pwsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgl1 mesa-vulkan-drivers xvfb
          python -m pip install 'scons==4.9.1'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $engineRoot = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $engineRoot
          $engine = Get-ChildItem -LiteralPath $engineRoot -Recurse -Filter 'Godot_v4.7.1-stable_mono_linux.x86_64' -File | Select-Object -First 1
          if ($null -eq $engine) { throw 'Godot 4.7.1 .NET Linux executable was not found after extraction.' }
          chmod +x $engine.FullName
          $engine.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Qualify Terrain3D and Godot Flow on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/Invoke-WorldGenerationAddonQualification.ps1 -GraphProvider godot-flow -RunId "ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-windows"

      - name: Qualify the 2 km reference world and canonical promotion on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/Invoke-WorldGenerationAddonQualification.ps1 -GraphProvider godot-flow -QualificationProfile reference-2km -RunId "ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-reference-windows"

      - name: Build and qualify the 2 km reference world and canonical promotion on Linux
        if: matrix.platform == 'linux'
        shell: pwsh
        run: xvfb-run --auto-servernum pwsh -NoProfile -File ./scripts/Invoke-WorldGenerationAddonQualification.ps1 -GraphProvider godot-flow -QualificationProfile reference-2km -RunId "ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-reference-linux" -BuildPcgFromSource -SkipCapture

      - name: Upload world-generation addon evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/world-generation/qualification/**/environment.json
            artifacts/world-generation/qualification/**/providers.json
            artifacts/world-generation/qualification/**/provider-installation-receipt.json
            artifacts/world-generation/qualification/**/recipe.json
            artifacts/world-generation/qualification/**/execution-plan.json
            artifacts/world-generation/qualification/**/metrics.json
            artifacts/world-generation/qualification/**/violations.json
            artifacts/world-generation/qualification/**/manual-review.json
            artifacts/world-generation/qualification/**/scene-manifest.json
            artifacts/world-generation/qualification/**/qualification-report.json
            artifacts/world-generation/qualification/**/hashes.sha256
            artifacts/world-generation/qualification/**/derived
            artifacts/world-generation/qualification/**/promotion-candidate
            artifacts/world-generation/qualification/**/captures
            artifacts/world-generation/qualification/**/logs
            artifacts/world-generation/qualification/**/failure.json
            artifacts/world-generation/reference-2km/**/environment.json
            artifacts/world-generation/reference-2km/**/providers.json
            artifacts/world-generation/reference-2km/**/provider-installation-receipt.json
            artifacts/world-generation/reference-2km/**/recipe.json
            artifacts/world-generation/reference-2km/**/execution-plan.json
            artifacts/world-generation/reference-2km/**/metrics.json
            artifacts/world-generation/reference-2km/**/violations.json
            artifacts/world-generation/reference-2km/**/manual-review.json
            artifacts/world-generation/reference-2km/**/scene-manifest.json
            artifacts/world-generation/reference-2km/**/qualification-report.json
            artifacts/world-generation/reference-2km/**/hashes.sha256
            artifacts/world-generation/reference-2km/**/derived
            artifacts/world-generation/reference-2km/**/promotion-candidate
            artifacts/world-generation/reference-2km/**/captures
            artifacts/world-generation/reference-2km/**/logs
            artifacts/world-generation/reference-2km/**/failure.json
          if-no-files-found: warn

  runtime-product-smoke:
    if: github.event_name != 'pull_request'
    needs: windows-core
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install Godot 4.7.1 .NET
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot-mono.zip'
          $engineRoot = Join-Path $env:RUNNER_TEMP 'godot-mono'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $engineRoot
          $engine = Get-ChildItem -LiteralPath $engineRoot -Recurse -Filter 'Godot_v4.7.1-stable_mono_win64_console.exe' -File | Select-Object -First 1
          if ($null -eq $engine) { throw 'Godot 4.7.1 .NET console executable was not found after extraction.' }
          $engine.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native ForgeScript bridge
        shell: pwsh
        run: ./scripts/Build-ForgeScriptNative.ps1

      - name: Run real runtime smoke
        shell: pwsh
        run: ./scripts/Verify.ps1 -Profile Runtime -Restore

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: runtime-product-smoke
          path: artifacts/verification
          if-no-files-found: warn
