name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore OpenRPGForge.sln --locked-mode

      - name: Verify formatting
        run: dotnet format OpenRPGForge.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build OpenRPGForge.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenRPGForge.sln --configuration Release --no-build --logger trx --results-directory artifacts/test-results
