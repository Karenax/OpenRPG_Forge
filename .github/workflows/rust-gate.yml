name: Rust gate

on:
  push:
    branches: [Rust]
  pull_request:
    branches: [Rust]

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies for Bevy and Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned Studio tools
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked tauri-cli --version 2.11.4
          cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Format
        run: cargo fmt --all -- --check
      - name: Engine architecture boundaries
        run: python -B -m unittest discover -s scripts -p test_engine_boundaries.py -v
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Build native runtime
        run: cargo build --locked --release -p forge_runtime
      - name: Build separate native game
        run: cargo build --locked --release -p forge_tidewater --example tidewater_plant_probe
      - name: Build Studio shell without installer bundle
        working-directory: apps/forge_studio
        run: cargo tauri build --no-bundle

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned Studio WebGPU tools
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Build WebGPU engine adapter
        run: cargo check --locked --target wasm32-unknown-unknown -p forge_engine --no-default-features --features web
      - name: Lint Studio WebGPU
        run: cargo clippy --locked --target wasm32-unknown-unknown -p forge_studio --no-default-features --features web -- -D warnings
      - name: Build Studio WebGPU bundle
        working-directory: apps/forge_studio
        run: trunk build --release --config Trunk.toml

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Policy check
        run: cargo deny check licenses bans sources advisories
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: RustSec audit
        shell: pwsh
        run: ./scripts/Test-RustSec.ps1
