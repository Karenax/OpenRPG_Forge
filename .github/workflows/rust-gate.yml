name: Rust gate

on:
  # Owner decision 2026-10-22: GitHub is a remote backup; no automatic checks.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native:
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      # Keep all tests and debug assertions; omit only symbols on small CI disks.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NO_COLOR: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies for Bevy and Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned Studio tools
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked tauri-cli --version 2.11.4
          cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Release installed-tool build intermediates
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true') { throw 'This cleanup is restricted to the CI runner.' }
          $expectedTarget = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'target'))
          $buildTarget = [IO.Path]::GetFullPath($env:CARGO_TARGET_DIR)
          if ($buildTarget -ne $expectedTarget) { throw 'Unexpected CI build directory; preserved.' }
          if ((Test-Path -LiteralPath $buildTarget) -and
              ((Get-Item -LiteralPath $buildTarget -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'CI build directory is a link; preserved.'
          }
          cargo clean --release --target-dir $buildTarget
          if ($LASTEXITCODE -ne 0) { throw 'Installed-tool build cleanup failed.' }
          $disk = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($buildTarget))
          Write-Host ('CI available disk after tool build cleanup: {0:N2} GiB' -f ($disk.AvailableFreeSpace / 1GB))
      - name: Format
        run: cargo fmt --all -- --check
      - name: Engine architecture boundaries
        run: python -B -m unittest discover -s scripts -p test_engine_boundaries.py -v
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - name: Build native runtime
        run: cargo build --locked --release -p forge_runtime
      - name: Build separate native game
        run: cargo build --locked --release -p forge_tidewater --example tidewater_plant_probe
      - name: Build Studio shell without installer bundle
        working-directory: apps/forge_studio
        run: cargo tauri build --no-bundle

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install pinned Studio WebGPU tools
        run: |
          cargo install --locked trunk --version 0.21.14
          cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Build WebGPU engine adapter
        run: cargo check --locked --target wasm32-unknown-unknown -p forge_engine --no-default-features --features web
      - name: Lint Studio WebGPU
        run: cargo clippy --locked --target wasm32-unknown-unknown -p forge_studio --no-default-features --features web -- -D warnings
      - name: Build Studio WebGPU bundle
        working-directory: apps/forge_studio
        run: trunk build --release --config Trunk.toml

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Policy check
        run: cargo deny check licenses bans sources advisories
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: RustSec audit
        shell: pwsh
        run: ./scripts/Test-RustSec.ps1
